<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Cook Planner</title>
    <meta name="theme-color" content="#c15a2b" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel" style="max-width: 680px; margin: 12vh auto 0; text-align: center;">
        <article class="card">
          <p class="eyebrow">Offline mode</p>
          <h1 style="max-width: none; margin-bottom: 18px;">No internet connection</h1>
          <p class="section-note" style="margin-bottom: 24px;">
            Cook Planner can still open from cache, but live updates and sign-in require connection.
          </p>
          <button class="primary-btn" type="button" onclick="window.location.reload()">Try again</button>
        </article>
      </section>
    </main>
    <script>
      (function () {
        var preferredLanguages = Array.isArray(navigator.languages) && navigator.languages.length > 0
          ? navigator.languages
          : [navigator.language];
        var language = String(preferredLanguages.find(Boolean) || 'en').toLowerCase().indexOf('bg') === 0 ? 'bg' : 'en';
        var texts = {
          en: {
            title: 'Offline | Cook Planner',
            eyebrow: 'Offline mode',
            heading: 'No internet connection',
            copy: 'Cook Planner can still open from cache, but live updates and sign-in require connection.',
            button: 'Try again'
          },
          bg: {
            title: 'Извън линия | Cook Planner',
            eyebrow: 'Режим без връзка',
            heading: 'Няма интернет връзка',
            copy: 'Cook Planner може да се отвори от кеша, но за живи обновявания и вход е нужна връзка.',
            button: 'Опитай отново'
          }
        };
        var text = texts[language];
        document.documentElement.lang = language;
        document.title = text.title;
        document.querySelector('.eyebrow').textContent = text.eyebrow;
        document.querySelector('h1').textContent = text.heading;
        document.querySelector('.section-note').textContent = text.copy;
        document.querySelector('.primary-btn').textContent = text.button;
      }());
    </script>
  </body>
</html>
